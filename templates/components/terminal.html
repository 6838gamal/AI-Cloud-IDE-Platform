<div class="terminal-panel hidden" id="terminal-panel">
    <div class="terminal-header">
        <span class="terminal-title" data-i18n="terminal">Terminal</span>
        <div class="terminal-actions">
            <button class="icon-btn-sm" onclick="clearTerminal()" title="Clear">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </button>
            <button class="icon-btn-sm" onclick="togglePanel('terminal')" title="Close">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
    </div>
    <div class="terminal-body" id="terminal-body" dir="ltr">
        <div class="terminal-output" id="terminal-output"></div>
        <div class="terminal-input-line">
            <span class="terminal-prompt">$</span>
            <input type="text" id="terminal-input" class="terminal-input" autocomplete="off" spellcheck="false">
        </div>
    </div>
</div>
